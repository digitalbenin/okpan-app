name: Setup Apple credentials
description: >-
  Imports the Developer ID certificate into a temporary keychain and writes the
  App Store Connect API key to disk, then exports what forge.config.js needs to
  sign and notarize the app.

inputs:
  csc-link:
    description: Base64 of the .p12 with the Developer ID Application certificate and its private key
    required: true
  csc-key-password:
    description: Password of the .p12
    required: true
  apple-api-key:
    description: Raw PEM content of the App Store Connect API key (.p8, Team Key with App Manager role)
    required: true
  apple-api-key-id:
    description: 10-character key id
    required: true
  apple-api-issuer:
    description: Issuer id (UUID) of the developer team
    required: true

runs:
  using: composite
  steps:
    - name: Import signing certificate
      shell: bash
      env:
        CSC_LINK: ${{ inputs.csc-link }}
        CSC_KEY_PASSWORD: ${{ inputs.csc-key-password }}
      run: |
        set -euo pipefail

        if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
          echo "::error::Secrets CSC_LINK and CSC_KEY_PASSWORD must both be configured"
          exit 1
        fi

        WORK_DIR="$RUNNER_TEMP/apple-signing"
        KEYCHAIN="$WORK_DIR/build.keychain"
        mkdir -p "$WORK_DIR"

        if ! printf '%s' "$CSC_LINK" | base64 --decode > "$WORK_DIR/cert.p12"; then
          echo "::error::CSC_LINK is not valid base64"
          exit 1
        fi
        test -s "$WORK_DIR/cert.p12" || { echo "::error::CSC_LINK decoded to an empty file"; exit 1; }

        KEYCHAIN_PWD=$(openssl rand -base64 24)
        security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
        security list-keychains -d user -s "$KEYCHAIN"

        # macOS' PKCS#12 importer only accepts legacy algorithms (SHA-1 MAC,
        # 3DES/RC2); test-apple-signing.yml prints the re-export command when
        # a modern .p12 fails here
        if ! security import "$WORK_DIR/cert.p12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign; then
          echo "::error::PKCS#12 import failed (wrong password, or modern PKCS#12 algorithms)"
          exit 1
        fi
        rm -f "$WORK_DIR/cert.p12"
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN"

        security find-identity -v -p codesigning "$KEYCHAIN"
        IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -m1 -o '"[^"]*"' | tr -d '"' || true)
        if [ -z "$IDENTITY" ]; then
          echo "::error::No valid signing identity in the .p12 (expected a Developer ID Application certificate with its private key)"
          exit 1
        fi

        echo "APPLE_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
        echo "APPLE_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

    - name: Write notarization API key
      shell: bash
      env:
        APPLE_API_KEY: ${{ inputs.apple-api-key }}
        APPLE_API_KEY_ID: ${{ inputs.apple-api-key-id }}
        APPLE_API_ISSUER: ${{ inputs.apple-api-issuer }}
      run: |
        set -euo pipefail

        if [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
          echo "::error::Secrets APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER must all be configured"
          exit 1
        fi

        KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
        printf '%s\n' "$APPLE_API_KEY" > "$KEY_PATH"
        if ! grep -q -- 'PRIVATE KEY' "$KEY_PATH"; then
          echo "::error::APPLE_API_KEY is not a PEM .p8 (expected -----BEGIN PRIVATE KEY-----)"
          exit 1
        fi

        echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
        echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
        echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
