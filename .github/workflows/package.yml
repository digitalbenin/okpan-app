name: Build macOS Electron App

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature-*package'

jobs:
  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install

      - name: Install website dependencies
        run: yarn --cwd src/website install

      - name: Build website (SvelteKit)
        run: yarn --cwd src/website build

      - name: Prepare database (push, seed, search setup)
        run: |
          yarn db:push
          yarn db:seed
          yarn db:search-setup

      - name: Build Electron app (ARM64)
        run: yarn make -- --arch=arm64

      - name: Inject unlock.command into maker ZIP (ARM64)
        shell: bash
        run: |
          set -euxo pipefail
          ZIP_DIR="out/make/zip/darwin/arm64"
          if [[ ! -d "$ZIP_DIR" ]]; then
            echo "Maker ZIP directory not found: $ZIP_DIR"
            exit 0
          fi
          ZIP_FILE=$(ls "$ZIP_DIR"/*.zip | head -n 1 || true)
          if [[ -z "$ZIP_FILE" ]]; then
            echo "No ZIP produced by maker-zip in $ZIP_DIR; skipping unlock injection."
            exit 0
          fi
          TMPDIR=$(mktemp -d)
          cat > "$TMPDIR/unlock.command" << 'EOF'
          #!/bin/bash
          xattr -c "$(cd "$(dirname "$0")" && pwd)/DataConnectionTool.app"
          EOF
          chmod +x "$TMPDIR/unlock.command"
          zip -j "$ZIP_FILE" "$TMPDIR/unlock.command"

      - name: Upload ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-arm64
          path: out/make/**/*
  
  build-macos-x64:
    name: Build macOS x64
