name: Build macOS Electron App

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install

      - name: Install website dependencies
        run: yarn --cwd src/website install

      - name: Prepare database (push, seed, search setup)
        run: |
          yarn db:push
          yarn db:seed
          yarn db:search-setup

      - name: Build Electron app (ARM64)
        run: yarn make -- --arch=arm64

      - name: Inject unlock.command into maker ZIP (ARM64)
        shell: bash
        run: |
          set -euxo pipefail
          ZIP_DIR="out/make/zip/darwin/arm64"
          if [[ ! -d "$ZIP_DIR" ]]; then
            echo "Maker ZIP directory not found: $ZIP_DIR"
            exit 0
          fi
          ZIP_FILE=$(ls "$ZIP_DIR"/*.zip | head -n 1 || true)
          if [[ -z "$ZIP_FILE" ]]; then
            echo "No ZIP produced by maker-zip in $ZIP_DIR; skipping unlock injection."
            exit 0
          fi
          TMPDIR=$(mktemp -d)
          cat > "$TMPDIR/unlock.command" << 'EOF'
          #!/bin/bash
          xattr -c "$(cd "$(dirname "$0")" && pwd)/DataConnectionTool.app"
          EOF
          chmod +x "$TMPDIR/unlock.command"
          zip -j "$ZIP_FILE" "$TMPDIR/unlock.command"

      - name: Upload ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-arm64
          path: out/make/**/*
  
  build-macos-x64:
    name: Build macOS x64
    runs-on: macos-15-intel

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install

      - name: Install website dependencies
        run: yarn --cwd src/website install

      - name: Prepare database (push, seed, search setup)
        run: |
          yarn db:push
          yarn db:seed
          yarn db:search-setup

      - name: Build Electron app (x64)
        run: yarn make -- --arch=x64

      - name: Inject unlock.command into maker ZIP (x64)
        shell: bash
        run: |
          set -euxo pipefail
          ZIP_DIR="out/make/zip/darwin/x64"
          if [[ ! -d "$ZIP_DIR" ]]; then
            echo "Maker ZIP directory not found: $ZIP_DIR"
            exit 0
          fi
          ZIP_FILE=$(ls "$ZIP_DIR"/*.zip | head -n 1 || true)
          if [[ -z "$ZIP_FILE" ]]; then
            echo "No ZIP produced by maker-zip in $ZIP_DIR; skipping unlock injection."
            exit 0
          fi
          TMPDIR=$(mktemp -d)
          cat > "$TMPDIR/unlock.command" << 'EOF'
          #!/bin/bash
          xattr -c "$(cd "$(dirname "$0")" && pwd)/DataConnectionTool.app"
          EOF
          chmod +x "$TMPDIR/unlock.command"
          zip -j "$ZIP_FILE" "$TMPDIR/unlock.command"

      - name: Upload x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-x64
          path: out/make/**/*

  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install

      - name: Install website dependencies
        run: yarn --cwd src/website install

      - name: Prepare database (push, seed, search setup)
        run: |
          yarn db:push
          yarn db:seed
          yarn db:search-setup

      - name: Build Electron app (x64)
        run: yarn make -- --arch=x64

      - name: Upload Windows x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: out/make/**/*

  create-release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    needs: [build-macos-arm64, build-macos-x64, build-windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/macOS-arm64/**/*
            artifacts/macOS-x64/**/*
            artifacts/windows-x64/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
