name: Package Electron App

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Apple signing & notarization
        uses: ./.github/actions/setup-apple-credentials
        with:
          csc-link: ${{ secrets.CSC_LINK }}
          csc-key-password: ${{ secrets.CSC_KEY_PASSWORD }}
          apple-api-key: ${{ secrets.APPLE_API_KEY }}
          apple-api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          apple-api-issuer: ${{ secrets.APPLE_API_ISSUER }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install website dependencies
        run: yarn --cwd src/website install --frozen-lockfile

      - name: Download embedding model
        run: yarn download-model

      - name: Build Electron app (ARM64)
        run: yarn make -- --arch=arm64

      - name: Notarize and staple the DMG
        uses: ./.github/actions/notarize-dmg

      - name: Zip macOS ARM64 release bundle
        shell: bash
        run: |
          dmg_path=$(find out/make -name "*.dmg" | head -n 1)
          zip -j okpan-macos-arm64.zip "$dmg_path"

      - name: Upload ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-arm64
          path: okpan-macos-arm64.zip
          retention-days: 1

  build-macos-x64:
    name: Build macOS x64
    runs-on: macos-15-intel

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Apple signing & notarization
        uses: ./.github/actions/setup-apple-credentials
        with:
          csc-link: ${{ secrets.CSC_LINK }}
          csc-key-password: ${{ secrets.CSC_KEY_PASSWORD }}
          apple-api-key: ${{ secrets.APPLE_API_KEY }}
          apple-api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          apple-api-issuer: ${{ secrets.APPLE_API_ISSUER }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install website dependencies
        run: yarn --cwd src/website install --frozen-lockfile

      - name: Verify bundled embedding runtime
        shell: bash
        run: |
          test -f node_modules/onnxruntime-node/bin/napi-v6/darwin/x64/onnxruntime_binding.node
          test -f node_modules/onnxruntime-node/bin/napi-v6/darwin/x64/libonnxruntime.1.23.2.dylib

      - name: Download embedding model
        run: yarn download-model

      - name: Build Electron app (x64)
        run: yarn make -- --arch=x64

      - name: Notarize and staple the DMG
        uses: ./.github/actions/notarize-dmg

      - name: Zip macOS x64 release bundle
        shell: bash
        run: |
          dmg_path=$(find out/make -name "*.dmg" | head -n 1)
          zip -j okpan-macos-x64.zip "$dmg_path"

      - name: Upload x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-x64
          path: okpan-macos-x64.zip
          retention-days: 1

  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 300000

      - name: Install website dependencies
        run: yarn --cwd src/website install --frozen-lockfile --network-timeout 300000

      - name: Download embedding model
        run: yarn download-model

      - name: Build Electron app (x64)
        run: yarn make -- --arch=x64

      - name: Upload Windows x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: out/make/**/*
          retention-days: 1

  create-release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    needs: [build-macos-arm64, build-macos-x64, build-windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/macOS-arm64/**/*
            artifacts/macOS-x64/**/*
            artifacts/windows-x64/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
