name: Package Electron App

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Apple signing & notarization
        uses: ./.github/actions/setup-apple-credentials
        with:
          csc-link: ${{ secrets.CSC_LINK }}
          csc-key-password: ${{ secrets.CSC_KEY_PASSWORD }}
          apple-api-key: ${{ secrets.APPLE_API_KEY }}
          apple-api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          apple-api-issuer: ${{ secrets.APPLE_API_ISSUER }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install website dependencies
        run: yarn --cwd src/website install --frozen-lockfile

      - name: Download embedding model
        run: yarn download-model

      - name: Package Electron app (ARM64)
        run: yarn package -- --arch=arm64

      - name: Verify bundled embedding model (non-blocking)
        continue-on-error: true
        shell: bash
        run: |
          model_dir="out/Okpan-darwin-arm64/Okpan.app/Contents/Resources/app/src/assets/models/onnx-community/embeddinggemma-300m-ONNX"
          for file in config.json tokenizer.json tokenizer_config.json onnx/model_q4.onnx onnx/model_q4.onnx_data; do
            if [ -f "$model_dir/$file" ]; then
              echo "Embedding model file present: $file"
            else
              echo "::warning title=Embedding model missing::Missing '$file' in the packaged app. AI field suggestions will need a network download at runtime."
            fi
          done

      - name: Notarize and staple the app
        uses: ./.github/actions/notarize-artifact
        with:
          path: out/Okpan-darwin-arm64/Okpan.app

      - name: Build DMG from the notarized app
        run: yarn make -- --arch=arm64 --skip-package

      - name: Notarize and staple the DMG
        uses: ./.github/actions/notarize-artifact

      - name: Upload ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-arm64
          path: out/make/**/*.dmg
          retention-days: 1

  build-macos-x64:
    name: Build macOS x64
    runs-on: macos-15-intel
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Apple signing & notarization
        uses: ./.github/actions/setup-apple-credentials
        with:
          csc-link: ${{ secrets.CSC_LINK }}
          csc-key-password: ${{ secrets.CSC_KEY_PASSWORD }}
          apple-api-key: ${{ secrets.APPLE_API_KEY }}
          apple-api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          apple-api-issuer: ${{ secrets.APPLE_API_ISSUER }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install website dependencies
        run: yarn --cwd src/website install --frozen-lockfile

      - name: Verify bundled embedding runtime
        shell: bash
        run: |
          test -f node_modules/onnxruntime-node/bin/napi-v6/darwin/x64/onnxruntime_binding.node
          test -f node_modules/onnxruntime-node/bin/napi-v6/darwin/x64/libonnxruntime.1.23.2.dylib

      - name: Download embedding model
        run: yarn download-model

      - name: Package Electron app (x64)
        run: yarn package -- --arch=x64

      - name: Verify bundled embedding model (non-blocking)
        continue-on-error: true
        shell: bash
        run: |
          model_dir="out/Okpan-darwin-x64/Okpan.app/Contents/Resources/app/src/assets/models/onnx-community/embeddinggemma-300m-ONNX"
          for file in config.json tokenizer.json tokenizer_config.json onnx/model_q4.onnx onnx/model_q4.onnx_data; do
            if [ -f "$model_dir/$file" ]; then
              echo "Embedding model file present: $file"
            else
              echo "::warning title=Embedding model missing::Missing '$file' in the packaged app. AI field suggestions will need a network download at runtime."
            fi
          done

      - name: Notarize and staple the app
        uses: ./.github/actions/notarize-artifact
        with:
          path: out/Okpan-darwin-x64/Okpan.app

      - name: Build DMG from the notarized app
        run: yarn make -- --arch=x64 --skip-package

      - name: Notarize and staple the DMG
        uses: ./.github/actions/notarize-artifact

      - name: Upload x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-x64
          path: out/make/**/*.dmg
          retention-days: 1

  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 300000

      - name: Install website dependencies
        run: yarn --cwd src/website install --frozen-lockfile --network-timeout 300000

      - name: Download embedding model
        run: yarn download-model

      - name: Build Electron app (x64)
        run: yarn make -- --arch=x64

      - name: Verify bundled embedding model (non-blocking)
        continue-on-error: true
        shell: bash
        run: |
          model_dir="out/Okpan-win32-x64/src/assets/models/onnx-community/embeddinggemma-300m-ONNX"
          for file in config.json tokenizer.json tokenizer_config.json onnx/model_q4.onnx onnx/model_q4.onnx_data; do
            if [ -f "$model_dir/$file" ]; then
              echo "Embedding model file present: $file"
            else
              echo "::warning title=Embedding model missing::Missing '$file' in the packaged app. AI field suggestions will need a network download at runtime."
            fi
          done

      - name: Upload Windows x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: out/make/**/*
          retention-days: 1

  build-linux-x64:
    name: Build Linux x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 300000

      - name: Install website dependencies
        run: yarn --cwd src/website install --frozen-lockfile --network-timeout 300000

      - name: Download embedding model
        run: yarn download-model

      - name: Build Electron app (x64, zip)
        run: yarn make -- --arch=x64 --targets=@electron-forge/maker-zip

      - name: Verify bundled embedding model (non-blocking)
        continue-on-error: true
        shell: bash
        run: |
          model_dir="out/Okpan-linux-x64/src/assets/models/onnx-community/embeddinggemma-300m-ONNX"
          for file in config.json tokenizer.json tokenizer_config.json onnx/model_q4.onnx onnx/model_q4.onnx_data; do
            if [ -f "$model_dir/$file" ]; then
              echo "Embedding model file present: $file"
            else
              echo "::warning title=Embedding model missing::Missing '$file' in the packaged app. AI field suggestions will need a network download at runtime."
            fi
          done

      - name: Upload Linux x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: out/make/zip/linux/x64/*.zip
          retention-days: 1

  create-release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    needs:
      - build-macos-arm64
      - build-macos-x64
      - build-windows-x64
      - build-linux-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # the Windows installer needs the whole make output (exe, nupkg, RELEASES)
          files: |
            artifacts/macOS-arm64/**/*.dmg
            artifacts/macOS-x64/**/*.dmg
            artifacts/windows-x64/**/*
            artifacts/linux-x64/**/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
