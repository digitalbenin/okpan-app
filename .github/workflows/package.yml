name: Build macOS Electron App

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature-*package'

jobs:
  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: yarn ci

      - name: Build Electron app (ARM64)
        run: yarn make -- --arch=arm64

      - name: Upload ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-arm64
          path: out/make/**/*
  
  build-macos-x64:
    name: Build macOS x64
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: yarn ci

      - name: Build Electron app (x64)
        run: yarn make -- --arch=x64

      - name: Upload x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-x64
          path: out/make/**/*