name: Package Electron App

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install

      - name: Install website dependencies
        run: yarn --cwd src/website install

      - name: Build Electron app (ARM64)
        run: yarn make -- --arch=arm64

      - name: Generate unlock.command
        shell: bash
        run: |
          cat > out/make/unlock.command << 'EOF'
          #!/bin/bash
          xattr -c /Applications/Okpan.app
          EOF
          chmod +x out/make/unlock.command

      - name: Zip macOS ARM64 release bundle
        shell: bash
        run: |
          dmg_path=$(find out/make -name "*.dmg" | head -n 1)
          zip -j okpan-macos-arm64.zip out/make/unlock.command "$dmg_path"

      - name: Upload ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-arm64
          path: okpan-macos-arm64.zip
  
  build-macos-x64:
    name: Build macOS x64
    runs-on: macos-15-intel

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install

      - name: Install website dependencies
        run: yarn --cwd src/website install

      - name: Build Electron app (x64)
        run: yarn make -- --arch=x64

      - name: Generate unlock.command
        shell: bash
        run: |
          cat > out/make/unlock.command << 'EOF'
          #!/bin/bash
          xattr -c /Applications/Okpan.app
          EOF
          chmod +x out/make/unlock.command

      - name: Zip macOS x64 release bundle
        shell: bash
        run: |
          dmg_path=$(find out/make -name "*.dmg" | head -n 1)
          zip -j okpan-macos-x64.zip out/make/unlock.command "$dmg_path"

      - name: Upload x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-x64
          path: okpan-macos-x64.zip

  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --network-timeout 300000

      - name: Install website dependencies
        run: yarn --cwd src/website install --network-timeout 300000

      - name: Build Electron app (x64)
        run: yarn make -- --arch=x64

      - name: Upload Windows x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: out/make/**/*

  create-release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    needs: [build-macos-arm64, build-macos-x64, build-windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate unlock.command
        shell: bash
        run: |
          cat > artifacts/unlock.command << 'EOF'
          #!/bin/bash
          xattr -c /Applications/Okpan.app
          EOF
          chmod +x artifacts/unlock.command

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/macOS-arm64/**/*
            artifacts/macOS-x64/**/*
            artifacts/windows-x64/**/*
            artifacts/unlock.command
          draft: false
          prerelease: false
          generate_release_notes: true
